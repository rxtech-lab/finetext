name: Xcode Build
on:
  push:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
      - name: Test release signing checks
        run: python3 scripts/ci/test_sign_sparkle.py
      - name: Test RxAgentSDK CLI integrations
        run: python3 scripts/test-claude-code.py
      - name: Test AI detector and automatic humanization
        run: python3 scripts/test-humanization.py
      - name: Build (unsigned)
        run: xcodebuild -project FineText.xcodeproj -scheme FineText -configuration Release -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build
