name: FineText
options:
  developmentLanguage: en
  bundleIdPrefix: app.rxlab
  deploymentTarget:
    macOS: '15.0'
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: P9KK452K8P
    INFOPLIST_KEY_CFBundleDisplayName: FineText
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    ARCHS: arm64
configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig
targets:
  FineText:
    type: application
    platform: macOS
    sources:
      - path: FineText
      - path: AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwift
        product: MLX
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rxlab.finetext
        PRODUCT_NAME: FineText
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Configuration/FineText.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        INFOPLIST_KEY_NSHumanReadableCopyright: © 2026 RxLab
    info:
      path: Generated/Info.plist
      properties:
        LSUIElement: true
        SUFeedURL: https://update.finetext.rxlab.app/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  FineText:
    build:
      targets:
        FineText: all
